<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{{siteTitle}}</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{siteDescription}}" />
    <meta name="keywords" content="{{keywords}}" />
    <meta name="theme-color" content="{{accentColor}}" />
    <meta name="robots" content="{{robotsMeta}}" />
    <meta property="og:title" content="{{ogTitle}}" />
    <meta property="og:description" content="{{ogDescription}}" />
    <meta property="og:type" content="{{ogType}}" />
    <meta property="og:url" content="{{canonicalUrl}}" />
    <meta name="twitter:title" content="{{ogTitle}}" />
    <meta name="twitter:description" content="{{ogDescription}}" />
    <link rel="canonical" href="{{canonicalUrl}}" />
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="LLM-friendly content" />
    <!-- Favicon (per-tenant; standard paths resolve by Host) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Open Graph Image -->
    <meta property="og:image" content="{{socialImageUrl}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ogImageAlt}}">
    <meta name="twitter:image" content="{{socialImageUrl}}">
    <meta name="twitter:card" content="summary_large_image">
    {{headSnippet}}
    
    <!-- Security headers - HTTP headers used instead of meta tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="no-referrer">
    
    <!-- Self-hosted fonts (static/fonts, latin subset, SIL OFL 1.1): Rajdhani
         600 (headings only) + JetBrains Mono 400/600 (tails, codes, table
         numerals). Body copy is the system UI stack, so prose never waits on
         or reflows for a web font. The @font-face rules open the inline style
         block below. font-display: optional because a late swap
         reflowed the hero (desktop CLS 0.14); the Rajdhani preload usually
         lands inside the optional block period. File names carry a content
         hash, so a new font file needs a new name. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/rajdhani-600-latin.35f7e628.woff2">

    <!-- Compiled Tailwind (src/styles/tailwind.css) -->
    {{stylesheetTag}}

    <style>
      @font-face {
        font-family: "Rajdhani";
        font-style: normal;
        font-weight: 600;
        font-display: optional;
        src: url(/static/fonts/rajdhani-600-latin.35f7e628.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 400 600;
        font-display: optional;
        src: url(/static/fonts/jetbrains-mono-latin.2c32b9b3.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      * {
        box-sizing: border-box;
      }

      :root {
        --color-base: #0a0f1a;
        --color-surface: #111827;
        --color-surface-elevated: #1a2332;
        --color-border: #243044;
        --color-text-primary: #f0f4f8;
        --color-text-secondary: #8b9cb3;
        --color-text-muted: #7a8ba2;
        --color-accent: {{uiAccentColor}};
        --color-accent-brand: {{accentColor}};
        --color-accent-dim: {{accentColorDim}};
        --color-success: #22c55e;
        --color-warn: #f59e0b;
        --color-danger: #f87171;
        --color-info: #58a6ff;
        --color-trial: #a78bfa;
        --color-neutral: #5a6a80;
        --font-display: 'Rajdhani', ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--color-base);
        color: var(--color-text-primary);
        width: 100%;
        font-family: var(--font-body);
        font-weight: 400;
      }

      /* Typography utilities */
      /* Rajdhani ships one weight (600). Pinning it here, unlayered, means no
         heading can ask for a face that isn't loaded and fall back to a
         synthesized or system weight on some pages but not others. */
      .font-display { font-family: var(--font-display); font-weight: 600; }
      .font-mono { font-family: var(--font-mono); }

      /* Custom color utilities */
      .bg-base { background-color: var(--color-base); }
      .bg-surface { background-color: var(--color-surface); }
      .bg-surface-elevated { background-color: var(--color-surface-elevated); }
      .border-subtle { border-color: var(--color-border); }
      .text-primary { color: var(--color-text-primary); }
      .text-secondary { color: var(--color-text-secondary); }
      .text-muted { color: var(--color-text-muted); }
      .text-accent { color: var(--color-accent); }

      /* Keyboard focus on a field. Unlayered on purpose: every field asks for
         focus:outline-none with focus:border-accent, and .border-subtle above
         (unlayered) beats that layered border, so a focused field showed no
         mark at all. One rule here mends each of them. */
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 1px;
      }

      /* A link inside a sentence: the accent and the grey prose around it are
         about equally bright, so colour alone can't mark it (WCAG 1.4.1). */
      :where(p, li, dd, figcaption) a.text-accent {
        text-decoration-line: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        text-decoration-color: color-mix(in srgb, currentColor 55%, transparent);
      }
      :where(p, li, dd, figcaption) a.text-accent:hover {
        text-decoration-color: currentColor;
      }

      /* Tooltip — CSS-only, works on hover and tap-to-focus. Trigger gets a
         dotted underline as the affordance; content comes from data-tip. */
      .tip {
        position: relative;
        text-decoration: underline dotted;
        text-decoration-color: var(--color-text-muted);
        text-underline-offset: 3px;
        cursor: help;
      }
      .tip::after {
        content: attr(data-tip);
        position: absolute;
        bottom: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%);
        background: var(--color-surface-elevated);
        color: var(--color-text-primary);
        border: 1px solid var(--color-border);
        border-radius: 6px;
        padding: 6px 9px;
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.4;
        white-space: normal;
        width: max-content;
        max-width: 260px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        opacity: 0;
        visibility: hidden;
        transition: opacity 120ms ease, visibility 120ms;
        pointer-events: none;
        z-index: 50;
      }
      .tip::before {
        content: '';
        position: absolute;
        bottom: calc(100% + 3px);
        left: 50%;
        transform: translateX(-50%);
        border: 5px solid transparent;
        border-top-color: var(--color-border);
        opacity: 0;
        visibility: hidden;
        transition: opacity 120ms ease, visibility 120ms;
        z-index: 50;
      }
      .tip:hover::after, .tip:hover::before,
      .tip:focus::after, .tip:focus::before,
      .tip:focus-within::after, .tip:focus-within::before {
        opacity: 1;
        visibility: visible;
      }
      /* Right-aligned variant — tooltip flows leftward to stay in viewport. */
      .tip-l::after { left: auto; right: 0; transform: none; }
      .tip-l::before { left: auto; right: 12px; transform: none; }

      /* Glow effects */
      .glow-accent {
        box-shadow: 0 0 20px color-mix(in srgb, var(--color-accent) 15%, transparent);
      }

      /* Grid background pattern */
      .grid-pattern {
        background-image:
          linear-gradient(rgba(36, 48, 68, 0.3) 1px, transparent 1px),
          linear-gradient(90deg, rgba(36, 48, 68, 0.3) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      /* Status indicator */
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--color-success);
        box-shadow: 0 0 8px var(--color-success);
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-surface);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-text-muted);
      }

      /* Animations */
      @keyframes pulse-glow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .animate-pulse-glow {
        animation: pulse-glow 2s ease-in-out infinite;
      }

      /* For readers who ask their device for less motion: the pulsing dots,
         the planner's travelling signal and its cards' slide-in all stop. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
    
    <!-- Analytics -->
    {{analyticsSnippet}}
  </head>
  <body>
    <div id="root">{{html}}</div>
    
    <!-- Security: Prevent clickjacking -->
    <script>
      if (window.self !== window.top) {
        window.top.location = window.self.location;
      }
    </script>
    
    <!-- Structured data for SEO -->
    {{webSiteJsonLd}}

    <!-- WebPage schema with ISO date for freshness signal -->
    {{webPageJsonLd}}

    <!-- FAQ Schema (per-airline, generated from src/airlines/content/) -->
    {{faqJsonLd}}

    <!-- Page-specific schema (e.g. Flight on /check-flight/{flightNumber}) -->
    {{pageJsonLd}}

    {{passengerProbeSnippet}}
  </body>
</html>
